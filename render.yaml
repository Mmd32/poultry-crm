services:
  - type: web
    name: poultry-crm-backend
    runtime: python
    buildCommand: bash build.sh
    preDeployCommand: bash predeploy.sh
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        value: GYvAJO918oQs6WJSbaZ5LPDlx7iqjouNjinUuWzU5VJozTsT2loHGJfVIEnuBFKZ9Ws
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: poultry-crm-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://poultry-crm.vercel.app"

  - type: cron
    name: poultry-crm-overdue
    runtime: python
    buildCommand: bash build.sh
    schedule: "0 2 * * *"
    startCommand: bash cron.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        value: GYvAJO918oQs6WJSbaZ5LPDlx7iqjouNjinUuWzU5VJozTsT2loHGJfVIEnuBFKZ9Ws
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: poultry-crm-db
          property: connectionString

databases:
  - name: poultry-crm-db
    plan: free
    databaseName: poultry_crm
